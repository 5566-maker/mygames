<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D 叠叠乐 - Stack 3D</title>
  <link rel="stylesheet" href="../../shared/game-shell.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #111425;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-container { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Top HUD */
    #hud {
      position: absolute; top: 60px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .score-val {
      font-size: clamp(48px, 12vw, 84px); font-weight: 900;
      color: #FFF; text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      line-height: 1; margin-bottom: 4px;
    }
    .combo-text {
      font-size: 16px; font-weight: 800; color: #FACC15;
      letter-spacing: 2px; height: 24px; transition: all 0.2s;
      text-shadow: 0 2px 10px rgba(250, 204, 21, 0.6);
    }

    /* Start / Game Over Overlay */
    #overlay {
      position: absolute; inset: 0; background: rgba(17, 20, 37, 0.88);
      backdrop-filter: blur(14px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20; color: #FFF;
      padding: 24px; text-align: center;
    }
    .game-title {
      font-size: clamp(36px, 8vw, 64px); font-weight: 900;
      background: linear-gradient(135deg, #38BDF8, #818CF8, #F472B6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px; letter-spacing: 2px;
    }
    .game-subtitle {
      font-size: 15px; color: #94A3B8; margin-bottom: 32px; font-weight: 600;
    }
    .btn-tap-start {
      padding: 16px 48px; border-radius: 999px;
      background: linear-gradient(135deg, #38BDF8, #0284C7); border: none;
      color: #FFF; font-size: 18px; font-weight: 800; cursor: pointer;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      transition: transform 0.15s ease;
    }
    .btn-tap-start:active { transform: scale(0.94); }
    .hint-tap {
      margin-top: 24px; font-size: 13px; color: #64748B;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud">
    <div class="score-val" id="score-display">0</div>
    <div class="combo-text" id="combo-display"></div>
  </div>

  <div id="overlay">
    <h1 class="game-title" id="overlay-title">3D 叠叠乐</h1>
    <p class="game-subtitle" id="overlay-sub">轻触 iPad 屏幕任意位置精准切块堆叠</p>
    <button class="btn-tap-start" id="btn-start">开始游戏 (TAP TO PLAY)</button>
    <p class="hint-tap">👆 单指点击 · 完美重叠可产生连续音阶与奖励！</p>
  </div>

  <script src="../../shared/game-shell.js"></script>
  <script type="module">
    import * as THREE from '../../shared/three.module.js';

    let scene, camera, renderer;
    let stack = [];
    let overhangs = [];
    let gameState = 'ready'; // ready, playing, ended
    let score = 0;
    let combo = 0;
    let currentDirection = 'x'; // 'x' or 'z'
    let moveSpeed = 0.08;
    let currentColorHue = 200;

    const BOX_HEIGHT = 0.8;
    const INITIAL_WIDTH = 6;
    const INITIAL_DEPTH = 6;

    const container = document.getElementById('game-container');
    const scoreDisplay = document.getElementById('score-display');
    const comboDisplay = document.getElementById('combo-display');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const btnStart = document.getElementById('btn-start');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111425);

      const aspect = window.innerWidth / window.innerHeight;
      const d = 10;
      camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, -100, 1000);
      camera.position.set(20, 25, 20);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.left = -15;
      dirLight.shadow.camera.right = 15;
      dirLight.shadow.camera.top = 15;
      dirLight.shadow.camera.bottom = -15;
      scene.add(dirLight);

      setupBase();
      setupEvents();
      animate();
    }

    function getColor(index) {
      const hue = (currentColorHue + index * 4) % 360;
      return new THREE.Color(`hsl(${hue}, 80%, 60%)`);
    }

    function createBox(x, y, z, width, depth, color) {
      const geo = new THREE.BoxGeometry(width, BOX_HEIGHT, depth);
      const mat = new THREE.MeshLambertMaterial({ color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function setupBase() {
      // Clear previous
      stack.forEach(b => scene.remove(b.mesh));
      overhangs.forEach(o => scene.remove(o.mesh));
      stack = [];
      overhangs = [];

      // Base block
      const baseMesh = createBox(0, 0, 0, INITIAL_WIDTH, INITIAL_DEPTH, getColor(0));
      stack.push({
        mesh: baseMesh,
        width: INITIAL_WIDTH,
        depth: INITIAL_DEPTH,
        x: 0,
        z: 0
      });

      camera.position.set(20, 25, 20);
      camera.lookAt(0, 0, 0);
    }

    function spawnNextLayer() {
      const prev = stack[stack.length - 1];
      const y = stack.length * BOX_HEIGHT;
      currentDirection = currentDirection === 'x' ? 'z' : 'x';

      const initialOffset = -12;
      const x = currentDirection === 'x' ? initialOffset : prev.x;
      const z = currentDirection === 'z' ? initialOffset : prev.z;

      const mesh = createBox(x, y, z, prev.width, prev.depth, getColor(stack.length));
      mesh.userData = {
        speed: moveSpeed + Math.min(stack.length * 0.002, 0.06),
        direction: 1
      };

      stack.push({
        mesh,
        width: prev.width,
        depth: prev.depth,
        x,
        z
      });

      // Smooth camera pan up
      const targetCamY = 25 + (stack.length - 1) * BOX_HEIGHT;
      camera.position.y = targetCamY;
      camera.lookAt(0, (stack.length - 1) * BOX_HEIGHT, 0);
    }

    function sliceBlock() {
      if (gameState !== 'playing') return;
      const current = stack[stack.length - 1];
      const prev = stack[stack.length - 2];

      const diff = currentDirection === 'x'
        ? current.mesh.position.x - prev.x
        : current.mesh.position.z - prev.z;

      const size = currentDirection === 'x' ? current.width : current.depth;
      const tolerance = 0.22; // Forgiveness margin for touch

      if (Math.abs(diff) < tolerance) {
        // Perfect snap!
        if (currentDirection === 'x') current.mesh.position.x = prev.x;
        else current.mesh.position.z = prev.z;

        combo++;
        const pitch = 300 + Math.min(combo * 45, 800);
        window.ArcadeSound.playTone(pitch, pitch + 50, 'sine', 0.12, 0.3);
        comboDisplay.textContent = `PERFECT x${combo}!`;

        current.x = prev.x;
        current.z = prev.z;
        score++;
        scoreDisplay.textContent = score;
        spawnNextLayer();
        return;
      }

      combo = 0;
      comboDisplay.textContent = '';

      if (Math.abs(diff) >= size) {
        // Complete miss! Game Over
        gameOver();
        return;
      }

      // Slicing logic
      const overlap = size - Math.abs(diff);
      const overhangSize = Math.abs(diff);

      const color = current.mesh.material.color;
      scene.remove(current.mesh);

      const newWidth = currentDirection === 'x' ? overlap : current.width;
      const newDepth = currentDirection === 'z' ? overlap : current.depth;

      const newX = currentDirection === 'x'
        ? prev.x + diff / 2
        : prev.x;
      const newZ = currentDirection === 'z'
        ? prev.z + diff / 2
        : prev.z;

      const newMesh = createBox(newX, current.mesh.position.y, newZ, newWidth, newDepth, color);
      current.mesh = newMesh;
      current.width = newWidth;
      current.depth = newDepth;
      current.x = newX;
      current.z = newZ;

      // Spawn falling cut-off piece
      const overX = currentDirection === 'x'
        ? (diff > 0 ? newX + overlap / 2 + overhangSize / 2 : newX - overlap / 2 - overhangSize / 2)
        : newX;
      const overZ = currentDirection === 'z'
        ? (diff > 0 ? newZ + overlap / 2 + overhangSize / 2 : newZ - overlap / 2 - overhangSize / 2)
        : newZ;
      const overW = currentDirection === 'x' ? overhangSize : newWidth;
      const overD = currentDirection === 'z' ? overhangSize : newDepth;

      const overMesh = createBox(overX, current.mesh.position.y, overZ, overW, overD, color);
      overhangs.push({
        mesh: overMesh,
        vy: 0,
        rotV: (Math.random() - 0.5) * 0.1
      });

      window.ArcadeSound.playTone(260, 200, 'triangle', 0.1, 0.2);
      score++;
      scoreDisplay.textContent = score;
      spawnNextLayer();
    }

    function gameOver() {
      gameState = 'ended';
      window.ArcadeSound.playHit();
      window.KidStorage.saveScore('stack-3d', score);

      overlay.style.display = 'flex';
      overlayTitle.textContent = '游戏结束';
      overlaySub.textContent = `最高堆叠: ${score} 层！`;
      btnStart.textContent = '再玩一次 (PLAY AGAIN)';
    }

    function startGame() {
      currentColorHue = Math.floor(Math.random() * 360);
      setupBase();
      score = 0;
      combo = 0;
      scoreDisplay.textContent = '0';
      comboDisplay.textContent = '';
      currentDirection = 'x';
      gameState = 'playing';
      overlay.style.display = 'none';
      spawnNextLayer();
      window.ArcadeSound.playWin();
    }

    function setupEvents() {
      // 100% Touch Support on entire container
      container.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (gameState === 'playing') {
          sliceBlock();
        }
      });

      btnStart.onclick = (e) => {
        e.stopPropagation();
        startGame();
      };

      // Keyboard spacebar support for desktop
      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          if (gameState === 'playing') sliceBlock();
          else if (gameState !== 'playing') startGame();
        }
      });

      window.addEventListener('resize', () => {
        const aspect = window.innerWidth / window.innerHeight;
        const d = 10;
        camera.left = -d * aspect;
        camera.right = d * aspect;
        camera.top = d;
        camera.bottom = -d;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      if (gameState === 'playing' && stack.length > 1) {
        const current = stack[stack.length - 1];
        const dir = currentDirection;
        const mesh = current.mesh;
        const speed = mesh.userData.speed;
        const bound = 10;

        if (dir === 'x') {
          mesh.position.x += speed * mesh.userData.direction;
          if (mesh.position.x > bound) mesh.userData.direction = -1;
          if (mesh.position.x < -bound) mesh.userData.direction = 1;
        } else {
          mesh.position.z += speed * mesh.userData.direction;
          if (mesh.position.z > bound) mesh.userData.direction = -1;
          if (mesh.position.z < -bound) mesh.userData.direction = 1;
        }
      }

      // Physics for sliced falling blocks
      for (let i = overhangs.length - 1; i >= 0; i--) {
        const o = overhangs[i];
        o.vy -= 0.04;
        o.mesh.position.y += o.vy;
        o.mesh.rotation.x += o.rotV;
        o.mesh.rotation.z += o.rotV;
        if (o.mesh.position.y < -30) {
          scene.remove(o.mesh);
          overhangs.splice(i, 1);
        }
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
