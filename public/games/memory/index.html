<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>动物翻翻乐 - 小小游戏厅</title>
  <link rel="stylesheet" href="../../shared/game-shell.css">
  <style>
    body {
      background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .memory-container {
      width: 100%;
      max-width: 480px;
      padding: 70px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Difficulty mode selector for toddlers */
    .mode-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 8px;
    }

    .mode-btn {
      padding: 8px 18px;
      border-radius: 999px;
      border: 3px solid #FFF;
      background: rgba(255, 255, 255, 0.2);
      color: #FFF;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .mode-btn.active {
      background: #FFD166;
      color: #2D3436;
      border-color: #FFA502;
    }

    /* Memory Grid */
    .grid {
      display: grid;
      gap: 12px;
      width: 100%;
      perspective: 1000px;
    }

    .grid-2x3 {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      max-height: 380px;
    }

    .grid-3x4 {
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      max-height: 480px;
    }

    /* Card */
    .card {
      aspect-ratio: 1;
      border-radius: 20px;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card.flipped, .card.matched {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.3);
      border: 4px solid #FFF;
    }

    .card-front {
      background: linear-gradient(135deg, #FF6B81, #FF4757);
      font-size: 38px;
    }

    .card-front::after {
      content: "❓";
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .card-back {
      background: #FFF;
      transform: rotateY(180deg);
      font-size: 52px;
    }

    .card.matched .card-back {
      background: #E8F5E9;
      border-color: #2ED573;
      animation: matchBounce 0.5s ease;
    }

    @keyframes matchBounce {
      0%, 100% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.12); }
    }
  </style>
</head>
<body>

  <div class="memory-container">
    <div class="mode-tabs">
      <button class="mode-btn active" id="btn-mode-easy">🐣 宝宝 6张 (2×3)</button>
      <button class="mode-btn" id="btn-mode-normal">🌟 进阶 12张 (3×4)</button>
    </div>

    <div class="grid grid-2x3" id="memoryGrid"></div>
  </div>

  <script>
    window.KID_GAME_ID = 'memory';
  </script>
  <script src="../../shared/game-shell.js"></script>
  <script>
    const ANIMAL_POOL = ['🐶', '🐱', '🐰', '🐼', '🦁', '🐨', '🍎', '🍓', '🍌', '🍉'];
    let currentMode = 'easy'; // 'easy' (6 cards) or 'normal' (12 cards)
    let cards = [];
    let flippedIndices = [];
    let matchedCount = 0;
    let moves = 0;
    let isLocked = false;

    const grid = document.getElementById('memoryGrid');
    const btnEasy = document.getElementById('btn-mode-easy');
    const btnNormal = document.getElementById('btn-mode-normal');

    btnEasy.addEventListener('click', () => {
      if (currentMode !== 'easy') {
        currentMode = 'easy';
        btnEasy.classList.add('active');
        btnNormal.classList.remove('active');
        grid.className = 'grid grid-2x3';
        window.KidAudio.playTap();
        startNewGame();
      }
    });

    btnNormal.addEventListener('click', () => {
      if (currentMode !== 'normal') {
        currentMode = 'normal';
        btnNormal.classList.add('active');
        btnEasy.classList.remove('active');
        grid.className = 'grid grid-3x4';
        window.KidAudio.playTap();
        startNewGame();
      }
    });

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startNewGame() {
      const pairCount = currentMode === 'easy' ? 3 : 6;
      const selectedEmojis = shuffle([...ANIMAL_POOL]).slice(0, pairCount);
      const deck = shuffle([...selectedEmojis, ...selectedEmojis]);

      grid.innerHTML = '';
      cards = [];
      flippedIndices = [];
      matchedCount = 0;
      moves = 0;
      isLocked = false;

      deck.forEach((emoji, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;
        card.dataset.emoji = emoji;

        card.innerHTML = `
          <div class="card-face card-front"></div>
          <div class="card-face card-back">${emoji}</div>
        `;

        card.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          handleCardTap(card, index, emoji);
        });

        grid.appendChild(card);
        cards.push(card);
      });
    }

    function handleCardTap(card, index, emoji) {
      if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) {
        return;
      }

      window.KidAudio.playTap();
      card.classList.add('flipped');
      flippedIndices.push({ card, index, emoji });

      if (flippedIndices.length === 2) {
        moves++;
        const [c1, c2] = flippedIndices;

        if (c1.emoji === c2.emoji) {
          // Matched!
          setTimeout(() => {
            c1.card.classList.add('matched');
            c2.card.classList.add('matched');
            window.KidAudio.playCoin();
            matchedCount++;
            flippedIndices = [];

            const totalPairs = currentMode === 'easy' ? 3 : 6;
            if (matchedCount === totalPairs) {
              setTimeout(() => {
                window.KidShell.showWin({
                  score: Math.max(10, 100 - moves * 5),
                  stars: 3,
                  message: `太厉害了！找出了所有一对对的小动物！`,
                  onRestart: startNewGame
                });
              }, 400);
            }
          }, 300);
        } else {
          // Not matched
          isLocked = true;
          setTimeout(() => {
            c1.card.classList.remove('flipped');
            c2.card.classList.remove('flipped');
            window.KidAudio.playHit();
            flippedIndices = [];
            isLocked = false;
          }, 800);
        }
      }
    }

    startNewGame();
  </script>
</body>
</html>
