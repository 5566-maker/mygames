<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Crystal Defense 3D</title>
  <link rel="stylesheet" href="../../shared/game-shell.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #0b1320;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-container { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Top HUD */
    #hud {
      position: absolute; top: 60px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 999px;
      padding: 8px 18px; color: #FFF; display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 800; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .hud-gold { color: #FACC15; }
    .hud-hp { color: #F43F5E; }
    .hud-wave { color: #38BDF8; }

    /* Bottom Build Selector */
    #build-menu {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 20px;
      padding: 10px 16px; display: none; align-items: center; gap: 14px;
      z-index: 15; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .build-btn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px; padding: 10px 14px; color: #F8FAFC; cursor: pointer;
      min-width: 80px; transition: all 0.15s;
    }
    .build-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.5); }
    .build-btn:active { transform: scale(0.95); }
    .build-icon { font-size: 24px; }
    .build-name { font-size: 11px; font-weight: 700; }
    .build-cost { font-size: 11px; font-weight: 800; color: #FACC15; }

    /* Speed and Wave control */
    #action-controls {
      position: absolute; bottom: 24px; right: 20px;
      display: flex; gap: 8px; z-index: 10;
    }
    .ctrl-btn {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 999px;
      padding: 10px 16px; color: #F8FAFC; font-size: 13px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .ctrl-btn:active { transform: scale(0.95); }

    /* Screen Overlay */
    #screen-overlay {
      position: absolute; inset: 0; background: rgba(11, 19, 32, 0.88);
      backdrop-filter: blur(16px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20; color: #FFF; text-align: center;
      padding: 24px;
    }
    .game-logo {
      font-size: clamp(32px, 6vw, 56px); font-weight: 900;
      background: linear-gradient(135deg, #38BDF8 0%, #818CF8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 2px; margin-bottom: 8px;
    }
    .game-sub { font-size: 14px; color: #94A3B8; letter-spacing: 2px; margin-bottom: 32px; font-weight: 600; }
    .btn-start {
      padding: 14px 42px; border-radius: 999px;
      background: linear-gradient(135deg, #38BDF8, #4F46E5); border: none;
      color: #FFF; font-size: 16px; font-weight: 800; letter-spacing: 1px;
      cursor: pointer; box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      transition: all 0.2s ease;
    }
    .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(56, 189, 248, 0.8); }
    .control-hint {
      margin-top: 32px; font-size: 12px; color: #64748B; line-height: 1.8; max-width: 440px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud">
    <div class="hud-box">
      <span>❤️</span><span id="hud-hp" class="hud-hp">20</span>
    </div>
    <div class="hud-box">
      <span>💰</span><span id="hud-gold" class="hud-gold">100</span>
    </div>
    <div class="hud-box">
      <span>🌊</span><span id="hud-wave" class="hud-wave">WAVE 1/10</span>
    </div>
  </div>

  <div id="build-menu">
    <div class="build-btn" data-type="arrow">
      <div class="build-icon">🏹</div>
      <div class="build-name">弩炮塔</div>
      <div class="build-cost">40g</div>
    </div>
    <div class="build-btn" data-type="frost">
      <div class="build-icon">❄️</div>
      <div class="build-name">冰霜塔</div>
      <div class="build-cost">60g</div>
    </div>
    <div class="build-btn" data-type="lightning">
      <div class="build-icon">⚡</div>
      <div class="build-name">雷电塔</div>
      <div class="build-cost">80g</div>
    </div>
    <div class="build-btn" id="btn-cancel-build" style="border-color:rgba(239,68,68,0.4); color:#FCA5A5;">
      <div class="build-icon">✕</div>
      <div class="build-name">取消</div>
    </div>
  </div>

  <div id="action-controls">
    <button class="ctrl-btn" id="btn-speed">⏩ 1x</button>
    <button class="ctrl-btn" id="btn-next-wave" style="color:#38BDF8;">⚔️ 下一波</button>
  </div>

  <div id="screen-overlay">
    <h1 class="game-logo">CRYSTAL DEFENSE</h1>
    <p class="game-sub">3D TACTICAL TOWER DEFENSE</p>
    <button class="btn-start" id="btn-play">START DEFENSE</button>
    <div class="control-hint">
      点击岛屿上的石柱基座建造箭塔、冰霜与雷电防御塔。<br>
      右键拖拽可环视 3D 浮空岛，滚轮自由缩放。保护中央母水晶免受破坏！
    </div>
  </div>

  <script src="./three.min.js"></script>
  <script src="../../shared/game-shell.js"></script>
  <script>
    'use strict';
    let scene, camera, renderer;
    let waypoints = [
      new THREE.Vector3(-14, 0.3, -12),
      new THREE.Vector3(-4, 0.3, -12),
      new THREE.Vector3(-4, 0.3, -2),
      new THREE.Vector3(8, 0.3, -2),
      new THREE.Vector3(8, 0.3, 8),
      new THREE.Vector3(0, 0.3, 8),
      new THREE.Vector3(0, 0.3, 0) // Crystal Goal
    ];

    let towerSlots = [
      { x: -8, z: -8, tower: null },
      { x: 0, z: -8, tower: null },
      { x: -8, z: 2, tower: null },
      { x: 4, z: -6, tower: null },
      { x: 4, z: 4, tower: null },
      { x: -4, z: 6, tower: null },
      { x: 6, z: 12, tower: null }
    ];

    let towers = [];
    let enemies = [];
    let projectiles = [];
    let particles = [];
    let selectedSlot = null;

    let hp = 20, gold = 120, currentWave = 1, maxWaves = 10;
    let waveSpawning = false, waveTimer = 0, enemiesRemaining = 0;
    let gameSpeed = 1;
    let isPlaying = false;

    // Camera control
    let isDragging = false, prevX = 0, prevY = 0;
    let camDistance = 32, camTheta = Math.PI / 4, camPhi = Math.PI / 4;

    const container = document.getElementById('game-container');
    const hudHp = document.getElementById('hud-hp');
    const hudGold = document.getElementById('hud-gold');
    const hudWave = document.getElementById('hud-wave');
    const buildMenu = document.getElementById('build-menu');
    const overlay = document.getElementById('screen-overlay');
    const btnPlay = document.getElementById('btn-play');
    const btnSpeed = document.getElementById('btn-speed');
    const btnNextWave = document.getElementById('btn-next-wave');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0c1424);
      scene.fog = new THREE.FogExp2(0x0c1424, 0.018);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
      updateCamera();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Light
      const amb = new THREE.AmbientLight(0x334466, 1.2);
      scene.add(amb);

      const sun = new THREE.DirectionalLight(0xfffaed, 2.0);
      sun.position.set(15, 30, 20);
      sun.castShadow = true;
      scene.add(sun);

      createIsland();
      setupEvents();
      animate();
    }

    function updateCamera() {
      camPhi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, camPhi));
      camera.position.x = camDistance * Math.cos(camPhi) * Math.sin(camTheta);
      camera.position.y = camDistance * Math.sin(camPhi);
      camera.position.z = camDistance * Math.cos(camPhi) * Math.cos(camTheta);
      camera.lookAt(0, 1, 0);
    }

    function createIsland() {
      // Floating Island Base
      const islandGeo = new THREE.CylinderGeometry(18, 12, 5, 24);
      const islandMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
      const island = new THREE.Mesh(islandGeo, islandMat);
      island.position.y = -2.5;
      island.receiveShadow = true;
      scene.add(island);

      // Green grass top
      const grassGeo = new THREE.CylinderGeometry(18, 18, 0.4, 24);
      const grassMat = new THREE.MeshLambertMaterial({ color: 0x15803d });
      const grass = new THREE.Mesh(grassGeo, grassMat);
      grass.position.y = -0.1;
      grass.receiveShadow = true;
      scene.add(grass);

      // Path Road
      for (let i = 0; i < waypoints.length - 1; i++) {
        const p1 = waypoints[i];
        const p2 = waypoints[i + 1];
        const dist = p1.distanceTo(p2);
        const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

        const rGeo = new THREE.BoxGeometry(2.4, 0.15, dist);
        const rMat = new THREE.MeshLambertMaterial({ color: 0xca8a04 });
        const roadSeg = new THREE.Mesh(rGeo, rMat);
        roadSeg.position.set(mid.x, 0.1, mid.z);
        roadSeg.lookAt(p2.x, 0.1, p2.z);
        roadSeg.receiveShadow = true;
        scene.add(roadSeg);
      }

      // Center Crystal Shrine
      const cryGeo = new THREE.OctahedronGeometry(1.4, 0);
      const cryMat = new THREE.MeshStandardMaterial({
        color: 0x38bdf8, emissive: 0x0284c7, roughness: 0.1, metalness: 0.8
      });
      const crystal = new THREE.Mesh(cryGeo, cryMat);
      crystal.position.set(0, 2.2, 0);
      scene.add(crystal);
      crystal.userData = { isCrystal: true };

      // Base pedestals for towers
      towerSlots.forEach((slot, idx) => {
        const baseGeo = new THREE.CylinderGeometry(1.4, 1.6, 0.5, 12);
        const baseMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.set(slot.x, 0.25, slot.z);
        base.userData = { slotIdx: idx };
        scene.add(base);
      });
    }

    function createTower(type, slot) {
      const g = new THREE.Group();
      g.position.set(slot.x, 0.5, slot.z);

      let color = 0x38bdf8, range = 7.5, fireRate = 0.8, dmg = 15;
      if (type === 'frost') {
        color = 0x67e8f9; range = 6.0; fireRate = 1.2; dmg = 8;
      } else if (type === 'lightning') {
        color = 0xa855f7; range = 8.5; fireRate = 1.6; dmg = 28;
      }

      const postGeo = new THREE.CylinderGeometry(0.5, 0.8, 2.2, 8);
      const postMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
      const post = new THREE.Mesh(postGeo, postMat);
      post.position.y = 1.1;
      g.add(post);

      const topGeo = new THREE.DodecahedronGeometry(0.8);
      const topMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4 });
      const top = new THREE.Mesh(topGeo, topMat);
      top.position.y = 2.4;
      g.add(top);

      scene.add(g);

      const towerObj = {
        mesh: g, type, range, fireRate, dmg,
        cooldown: 0, x: slot.x, z: slot.z
      };
      towers.push(towerObj);
      slot.tower = towerObj;
    }

    function spawnEnemy(type = 'goblin') {
      const g = new THREE.Group();
      const start = waypoints[0];
      g.position.copy(start);

      let maxHp = 35 + currentWave * 15;
      let speed = 2.4;
      let color = 0x22c55e;
      let scale = 0.8;

      if (type === 'boss') {
        maxHp *= 4.5;
        speed = 1.3;
        color = 0xef4444;
        scale = 1.6;
      }

      const bodyGeo = new THREE.SphereGeometry(0.7 * scale, 8, 8);
      const bodyMat = new THREE.MeshLambertMaterial({ color });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.7 * scale;
      g.add(body);

      scene.add(g);

      enemies.push({
        mesh: g,
        hp: maxHp,
        maxHp,
        speed,
        baseSpeed: speed,
        slowTimer: 0,
        wpIdx: 1
      });
    }

    function startNextWave() {
      if (waveSpawning) return;
      waveSpawning = true;
      enemiesRemaining = 6 + currentWave * 3;
      hudWave.textContent = `WAVE ${currentWave}/${maxWaves}`;
      window.ArcadeSound.playTone(440, 880, 'triangle', 0.2);
    }

    function setupEvents() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      // Click slot to build
      window.addEventListener('pointerdown', e => {
        if (e.target.closest('#hud') || e.target.closest('#build-menu') || e.target.closest('#action-controls') || e.target.closest('#arcade-shell-bar')) return;

        if (e.button === 0) {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);

          const intersects = raycaster.intersectObjects(scene.children, true);
          if (intersects.length > 0) {
            let obj = intersects[0].object;
            while (obj && obj.userData.slotIdx === undefined && obj.parent) {
              obj = obj.parent;
            }
            if (obj && obj.userData.slotIdx !== undefined) {
              const idx = obj.userData.slotIdx;
              const slot = towerSlots[idx];
              if (!slot.tower) {
                selectedSlot = slot;
                buildMenu.style.display = 'flex';
                window.ArcadeSound.playTap();
              }
            } else {
              buildMenu.style.display = 'none';
            }
          }
        } else if (e.button === 2) {
          isDragging = true;
          prevX = e.clientX;
          prevY = e.clientY;
        }
      });

      window.addEventListener('mousemove', e => {
        if (isDragging) {
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          prevX = e.clientX;
          prevY = e.clientY;
          camTheta -= dx * 0.008;
          camPhi += dy * 0.008;
          updateCamera();
        }
      });

      window.addEventListener('mouseup', () => isDragging = false);
      window.addEventListener('contextmenu', e => e.preventDefault());

      window.addEventListener('wheel', e => {
        camDistance = Math.max(14, Math.min(65, camDistance + e.deltaY * 0.04));
        updateCamera();
      }, { passive: true });

      // Build Buttons
      document.querySelectorAll('.build-btn[data-type]').forEach(btn => {
        btn.onclick = () => {
          const type = btn.dataset.type;
          const cost = type === 'arrow' ? 40 : (type === 'frost' ? 60 : 80);
          if (gold >= cost && selectedSlot && !selectedSlot.tower) {
            gold -= cost;
            hudGold.textContent = gold;
            createTower(type, selectedSlot);
            window.ArcadeSound.playPowerup();
            buildMenu.style.display = 'none';
          } else {
            window.ArcadeSound.playHit();
          }
        };
      });

      document.getElementById('btn-cancel-build').onclick = () => {
        buildMenu.style.display = 'none';
      };

      btnSpeed.onclick = () => {
        gameSpeed = gameSpeed === 1 ? 2 : 1;
        btnSpeed.textContent = `⏩ ${gameSpeed}x`;
        btnSpeed.style.color = gameSpeed === 2 ? '#38BDF8' : '#FFF';
      };

      btnNextWave.onclick = () => startNextWave();

      btnPlay.onclick = () => {
        hp = 20; gold = 120; currentWave = 1;
        hudHp.textContent = hp;
        hudGold.textContent = gold;
        hudWave.textContent = `WAVE 1/${maxWaves}`;
        overlay.style.display = 'none';
        isPlaying = true;
        startNextWave();
      };

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.05) * gameSpeed;
      lastTime = now;

      if (isPlaying) {
        // Spawn wave enemies
        if (waveSpawning) {
          waveTimer += dt;
          if (waveTimer > 1.2 && enemiesRemaining > 0) {
            waveTimer = 0;
            enemiesRemaining--;
            const isBoss = enemiesRemaining === 0 && currentWave % 5 === 0;
            spawnEnemy(isBoss ? 'boss' : 'goblin');
          }
          if (enemiesRemaining === 0 && enemies.length === 0) {
            waveSpawning = false;
            currentWave++;
            gold += 30 + currentWave * 10;
            hudGold.textContent = gold;
            window.ArcadeSound.playWin();

            if (currentWave > maxWaves) {
              isPlaying = false;
              window.KidStorage.saveScore('crystal-defense', 1000 + hp * 50);
              overlay.style.display = 'flex';
              overlay.querySelector('.game-logo').textContent = 'VICTORY!';
              overlay.querySelector('.game-sub').textContent = 'YOU DEFENDED THE MOTHER CRYSTAL ACROSS ALL 10 WAVES!';
              btnPlay.textContent = 'PLAY AGAIN';
              return;
            }
          }
        }

        // Update Towers & Target
        towers.forEach(t => {
          t.cooldown -= dt;
          if (t.cooldown <= 0) {
            // Find closest enemy in range
            let target = null;
            let minDist = t.range;
            for (let i = 0; i < enemies.length; i++) {
              const e = enemies[i];
              const d = Math.hypot(e.mesh.position.x - t.x, e.mesh.position.z - t.z);
              if (d < minDist) {
                minDist = d;
                target = e;
              }
            }

            if (target) {
              t.cooldown = t.fireRate;
              fireTower(t, target);
            }
          }
        });

        // Update Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          p.mesh.position.addScaledVector(p.vel, dt);
          p.life -= dt;

          if (p.target && p.target.mesh && p.mesh.position.distanceTo(p.target.mesh.position) < 1.2) {
            p.target.hp -= p.dmg;
            if (p.type === 'frost') {
              p.target.slowTimer = 2.5;
            }
            window.ArcadeSound.playHit();
            scene.remove(p.mesh);
            projectiles.splice(i, 1);
            continue;
          }

          if (p.life <= 0) {
            scene.remove(p.mesh);
            projectiles.splice(i, 1);
          }
        }

        // Update Enemies along path
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          if (e.slowTimer > 0) {
            e.slowTimer -= dt;
            e.speed = e.baseSpeed * 0.45;
          } else {
            e.speed = e.baseSpeed;
          }

          const targetWp = waypoints[e.wpIdx];
          const dir = new THREE.Vector3().subVectors(targetWp, e.mesh.position);
          const dist = dir.length();

          if (dist < 0.4) {
            e.wpIdx++;
            if (e.wpIdx >= waypoints.length) {
              // Enemy reached crystal!
              hp = Math.max(0, hp - 1);
              hudHp.textContent = hp;
              window.ArcadeSound.playHit();
              scene.remove(e.mesh);
              enemies.splice(i, 1);

              if (hp <= 0) {
                isPlaying = false;
                overlay.style.display = 'flex';
                overlay.querySelector('.game-logo').textContent = 'CRYSTAL SHATTERED';
                overlay.querySelector('.game-sub').textContent = 'THE FLOATING SANCTUARY HAS FALLEN';
                btnPlay.textContent = 'TRY AGAIN';
              }
              continue;
            }
          } else {
            dir.normalize();
            e.mesh.position.addScaledVector(dir, e.speed * dt);
          }

          // Death check
          if (e.hp <= 0) {
            gold += 12;
            hudGold.textContent = gold;
            window.ArcadeSound.playCoin();
            scene.remove(e.mesh);
            enemies.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    function fireTower(tower, target) {
      window.ArcadeSound.playTone(tower.type === 'lightning' ? 900 : 450, 150, 'square', 0.08);

      const pGeo = new THREE.SphereGeometry(tower.type === 'lightning' ? 0.35 : 0.22, 6, 6);
      const pColor = tower.type === 'frost' ? 0x67e8f9 : (tower.type === 'lightning' ? 0xa855f7 : 0xfacc15);
      const pMat = new THREE.MeshBasicMaterial({ color: pColor });
      const pMesh = new THREE.Mesh(pGeo, pMat);
      pMesh.position.set(tower.x, 2.5, tower.z);
      scene.add(pMesh);

      const dir = new THREE.Vector3().subVectors(target.mesh.position, pMesh.position).normalize();
      projectiles.push({
        mesh: pMesh,
        vel: dir.multiplyScalar(28),
        target,
        dmg: tower.dmg,
        type: tower.type,
        life: 1.2
      });
    }

    init();
  </script>
</body>
</html>
