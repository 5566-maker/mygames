<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>玩具塔防 - 小小游戏厅</title>
  <link rel="stylesheet" href="../../shared/game-shell.css">
  <style>
    body {
      background: #2f3640;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 500px;
      max-height: 850px;
      object-fit: contain;
      background: #71b280;
    }

    /* Speed Control Pill */
    .speed-btn {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 16px);
      right: calc(var(--safe-right) + 16px);
      z-index: 100;
      padding: 10px 20px;
      border-radius: 999px;
      background: #FFD166;
      border: 3px solid #FFF;
      color: #2D3436;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="600"></canvas>
  <button class="speed-btn" id="speedBtn">⚡ 1x 速度</button>

  <script>
    window.KID_GAME_ID = 'tower-defense';
  </script>
  <script src="../../shared/game-shell.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const W = 360, H = 600;
    let gameSpeed = 1;
    let gold = 80;
    let lives = 10;
    let wave = 1;
    let isGameOver = false;

    // Fixed path waypoints
    const WAYPOINTS = [
      { x: -20, y: 150 },
      { x: 280, y: 150 },
      { x: 280, y: 320 },
      { x: 80, y: 320 },
      { x: 80, y: 480 },
      { x: 380, y: 480 }
    ];

    // Grid placement tiles (empty building slots)
    const TILE_SLOTS = [
      { x: 80, y: 220, tower: null },
      { x: 180, y: 220, tower: null },
      { x: 180, y: 400, tower: null },
      { x: 280, y: 400, tower: null },
      { x: 80, y: 80, tower: null },
      { x: 180, y: 80, tower: null }
    ];

    let enemies = [];
    let projectiles = [];
    let particles = [];
    let spawnTimer = 0;
    let enemiesLeftInWave = 8;

    function resetGame() {
      gold = 80;
      lives = 10;
      wave = 1;
      TILE_SLOTS.forEach(t => t.tower = null);
      enemies = [];
      projectiles = [];
      particles = [];
      spawnTimer = 0;
      enemiesLeftInWave = 8;
      isGameOver = false;
    }

    // Speed toggle
    const speedBtn = document.getElementById('speedBtn');
    speedBtn.addEventListener('click', () => {
      gameSpeed = gameSpeed === 1 ? 2 : 1;
      speedBtn.textContent = `⚡ ${gameSpeed}x 速度`;
      window.KidAudio.playTap();
    });

    // Tap to build / upgrade tower
    canvas.addEventListener('pointerdown', (e) => {
      if (isGameOver || window.KidShell?.isPaused) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      TILE_SLOTS.forEach(slot => {
        if (Math.hypot(x - slot.x, y - slot.y) < 32) {
          if (!slot.tower) {
            // Build tower
            if (gold >= 30) {
              gold -= 30;
              slot.tower = { level: 1, range: 110, cooldown: 0, fireRate: 35 };
              window.KidAudio.playPowerup();
            } else {
              window.KidAudio.playHit();
            }
          } else if (slot.tower.level < 3) {
            // Upgrade tower
            if (gold >= 40) {
              gold -= 40;
              slot.tower.level++;
              slot.tower.range += 20;
              slot.tower.fireRate = Math.max(15, slot.tower.fireRate - 8);
              window.KidAudio.playCoin();
            }
          }
        }
      });
    });

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 6; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          r: Math.random() * 3 + 2,
          color,
          life: 15
        });
      }
    }

    function update() {
      if (window.KidShell?.isPaused || isGameOver) return;

      for (let s = 0; s < gameSpeed; s++) {
        // Spawn wave enemies
        spawnTimer++;
        if (enemiesLeftInWave > 0 && spawnTimer % 50 === 0) {
          enemiesLeftInWave--;
          enemies.push({
            x: WAYPOINTS[0].x,
            y: WAYPOINTS[0].y,
            targetIdx: 1,
            hp: 6 + wave * 3,
            maxHp: 6 + wave * 3,
            speed: 1.4,
            icon: wave % 2 === 0 ? '👾' : '🐌'
          });
        }

        // Wave finished check
        if (enemiesLeftInWave === 0 && enemies.length === 0) {
          wave++;
          gold += 40;
          enemiesLeftInWave = 6 + wave * 2;
          window.KidAudio.playCoin();

          if (wave > 5) {
            isGameOver = true;
            window.KidShell.showWin({
              score: wave * 100 + gold,
              stars: 3,
              message: '恭喜通关！小城堡守住啦！',
              onRestart: resetGame
            });
            return;
          }
        }

        // Update towers & shoot
        TILE_SLOTS.forEach(slot => {
          if (!slot.tower) return;
          const t = slot.tower;
          t.cooldown++;

          if (t.cooldown >= t.fireRate) {
            // Find target in range
            const target = enemies.find(e => Math.hypot(e.x - slot.x, e.y - slot.y) <= t.range);
            if (target) {
              t.cooldown = 0;
              projectiles.push({
                x: slot.x,
                y: slot.y,
                target,
                speed: 6,
                dmg: t.level * 2
              });
              window.KidAudio.playTap();
            }
          }
        });

        // Update projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          if (!enemies.includes(p.target)) {
            projectiles.splice(i, 1);
            continue;
          }

          const angle = Math.atan2(p.target.y - p.y, p.target.x - p.x);
          p.x += Math.cos(angle) * p.speed;
          p.y += Math.sin(angle) * p.speed;

          if (Math.hypot(p.x - p.target.x, p.y - p.target.y) < 10) {
            p.target.hp -= p.dmg;
            spawnParticles(p.x, p.y, '#ffd166');
            if (p.target.hp <= 0) {
              gold += 8;
              const idx = enemies.indexOf(p.target);
              if (idx !== -1) enemies.splice(idx, 1);
            }
            projectiles.splice(i, 1);
          }
        }

        // Update enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          const wp = WAYPOINTS[e.targetIdx];
          const angle = Math.atan2(wp.y - e.y, wp.x - e.x);
          e.x += Math.cos(angle) * e.speed;
          e.y += Math.sin(angle) * e.speed;

          if (Math.hypot(e.x - wp.x, e.y - wp.y) < 4) {
            e.targetIdx++;
            if (e.targetIdx >= WAYPOINTS.length) {
              // Enemy reached castle
              lives--;
              window.KidAudio.playHit();
              enemies.splice(i, 1);

              if (lives <= 0) {
                isGameOver = true;
                window.KidShell.showGameOver({
                  score: wave * 50 + gold,
                  message: '下次一定能守住小城堡！',
                  onRestart: resetGame
                });
                return;
              }
              continue;
            }
          }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const pt = particles[i];
          pt.x += pt.vx;
          pt.y += pt.vy;
          pt.life--;
          if (pt.life <= 0) particles.splice(i, 1);
        }
      }
    }

    function render() {
      // Grass background
      ctx.fillStyle = '#78e08f';
      ctx.fillRect(0, 0, W, H);

      // Draw dirt path
      ctx.strokeStyle = '#f6b93b';
      ctx.lineWidth = 42;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      WAYPOINTS.forEach((wp, idx) => {
        if (idx === 0) ctx.moveTo(wp.x, wp.y);
        else ctx.lineTo(wp.x, wp.y);
      });
      ctx.stroke();

      // Draw Castle at end
      ctx.font = '38px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🏰', 340, 480);

      // Draw Tile Slots & Towers
      TILE_SLOTS.forEach(slot => {
        ctx.fillStyle = slot.tower ? '#4a69bd' : 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.arc(slot.x, slot.y, 24, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 3;
        ctx.stroke();

        if (slot.tower) {
          ctx.font = '28px sans-serif';
          ctx.fillText(slot.tower.level === 3 ? '⚡' : '🏹', slot.x, slot.y);
          // Level badge
          ctx.fillStyle = '#f6b93b';
          ctx.font = 'bold 12px sans-serif';
          ctx.fillText(`Lv.${slot.tower.level}`, slot.x, slot.y + 20);
        } else {
          ctx.font = '16px sans-serif';
          ctx.fillStyle = '#FFF';
          ctx.fillText('➕', slot.x, slot.y);
        }
      });

      // Projectiles
      projectiles.forEach(p => {
        ctx.fillStyle = '#eb2f06';
        ctx.beginPath();
        ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Enemies
      enemies.forEach(e => {
        ctx.font = '30px sans-serif';
        ctx.fillText(e.icon, e.x, e.y);

        // Health bar
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(e.x - 16, e.y - 20, 32, 5);
        ctx.fillStyle = '#e55039';
        ctx.fillRect(e.x - 16, e.y - 20, (e.hp / e.maxHp) * 32, 5);
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });

      // Top HUD
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.roundRect(14, 56, 332, 40, 20);
      ctx.fill();

      ctx.font = '18px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#FFF';
      ctx.fillText(`❤️ ${lives}`, 24, 76);
      ctx.fillText(`💰 ${gold}`, 120, 76);
      ctx.textAlign = 'right';
      ctx.fillText(`第 ${wave} 波`, 330, 76);

      requestAnimationFrame(() => {
        update();
        render();
      });
    }

    render();
  </script>
</body>
</html>
