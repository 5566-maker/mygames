<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 820" width="1920" height="820">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062817"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#060913" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#060913" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="820" fill="url(#bg)"/>
  <rect width="1920" height="820" fill="url(#glow)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="0" y1="205" x2="1920" y2="205"/>
    <line x1="0" y1="410" x2="1920" y2="410"/>
    <line x1="0" y1="615" x2="1920" y2="615"/>
    <line x1="480" y1="0" x2="480" y2="820"/>
    <line x1="960" y1="0" x2="960" y2="820"/>
    <line x1="1440" y1="0" x2="1440" y2="820"/>
  </g>

  <!-- Giant Icon Backdrop -->
  <text x="1440" y="533" font-size="340" text-anchor="middle" opacity="0.35" filter="drop-shadow(0 0 40px #10b981)">🏰</text>

  <!-- Vignette overlay -->
  <rect width="1920" height="820" fill="url(#overlay)"/>

  <!-- Content -->
  <g transform="translate(120, 600)">
    <!-- Category Badge -->
    <rect width="130" height="34" rx="8" fill="rgba(255,255,255,0.12)" stroke="#10b981" stroke-width="1.5"/>
    <text x="65" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#10b981" text-anchor="middle" letter-spacing="1.5">TOUCH · STRATEGY</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="2" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.8))">TOY TOWER DEFENSE</text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="2.5">CLASSIC TOWER DEFENSE</text>
  </g>
</svg>