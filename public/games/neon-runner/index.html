<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Velocity 3D</title>
  <link rel="stylesheet" href="../../shared/game-shell.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #070b19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    
    /* HUD */
    #hud {
      position: absolute; top: 60px; left: 20px; right: 20px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .hud-box {
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px;
      padding: 8px 16px; color: #FFF; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .hud-label { font-size: 10px; font-weight: 800; color: #38BDF8; letter-spacing: 1.5px; }
    .hud-val { font-size: 22px; font-weight: 900; font-family: monospace; letter-spacing: 1px; color: #FFF; }
    
    /* Mobile Controls */
    #mobile-controls {
      position: absolute; bottom: 20px; left: 20px; right: 20px;
      display: none; justify-content: space-between; pointer-events: none; z-index: 15;
    }
    @media (pointer: coarse), (max-width: 900px) {
      #mobile-controls { display: flex; }
    }
    .touch-btn {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.75); border: 2px solid rgba(56, 189, 248, 0.4);
      color: #38BDF8; font-size: 26px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto; backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5); active-scale: 0.9;
    }
    .touch-btn:active { transform: scale(0.92); background: rgba(56, 189, 248, 0.3); }

    /* Overlay Screen */
    #screen-overlay {
      position: absolute; inset: 0; background: rgba(7, 11, 25, 0.85);
      backdrop-filter: blur(14px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20; color: #FFF; text-align: center;
      padding: 24px;
    }
    .game-logo {
      font-size: clamp(32px, 6vw, 56px); font-weight: 900;
      background: linear-gradient(135deg, #38BDF8 0%, #C084FC 50%, #F472B6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: 2px; margin-bottom: 8px;
    }
    .game-sub { font-size: 14px; color: #94A3B8; letter-spacing: 2px; margin-bottom: 32px; font-weight: 600; }
    .btn-start {
      padding: 14px 42px; border-radius: 999px;
      background: linear-gradient(135deg, #38BDF8, #0284C7); border: none;
      color: #FFF; font-size: 16px; font-weight: 800; letter-spacing: 1px;
      cursor: pointer; box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
      transition: all 0.2s ease;
    }
    .btn-start:hover { transform: scale(1.05); box-shadow: 0 0 35px rgba(56, 189, 248, 0.8); }
    .control-hint {
      margin-top: 32px; font-size: 12px; color: #64748B; line-height: 1.8; max-width: 400px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">DISTANCE</div>
      <div class="hud-val" id="hud-dist">0m</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">ENERGY CELLS</div>
      <div class="hud-val" id="hud-score" style="color: #FACC15;">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">SPEED</div>
      <div class="hud-val" id="hud-speed" style="color: #38BDF8;">1.0x</div>
    </div>
  </div>

  <div id="mobile-controls">
    <div style="display:flex; gap:12px;">
      <button class="touch-btn" id="btn-left">◀</button>
      <button class="touch-btn" id="btn-right">▶</button>
    </div>
    <div style="display:flex; gap:12px;">
      <button class="touch-btn" id="btn-slide">▼</button>
      <button class="touch-btn" id="btn-jump">▲</button>
    </div>
  </div>

  <div id="screen-overlay">
    <h1 class="game-logo">NEON VELOCITY</h1>
    <p class="game-sub">CYBERPUNK 3D RUNNER</p>
    <button class="btn-start" id="btn-play">START RUN</button>
    <div class="control-hint">
      [A / D] 或 [← / →] 换道 &nbsp;·&nbsp; [W / ↑] 跳跃 &nbsp;·&nbsp; [S / ↓] 滑铲避让<br>
      移动端支持滑动屏幕或使用底部虚拟按键
    </div>
  </div>

  <script src="./three.min.js"></script>
  <script src="../../shared/game-shell.js"></script>
  <script>
    'use strict';
    let scene, camera, renderer;
    let player, playerTrail;
    let lanes = [-2.8, 0, 2.8];
    let currentLane = 1;
    let targetX = 0;
    let isJumping = false, jumpY = 0, jumpV = 0;
    let isSliding = false, slideTimer = 0;
    let obstacles = [];
    let items = [];
    let distance = 0, score = 0, speed = 40, baseSpeed = 40;
    let isRunning = false;
    let synthLoopTimer = 0;

    const container = document.getElementById('game-container');
    const hudDist = document.getElementById('hud-dist');
    const hudScore = document.getElementById('hud-score');
    const hudSpeed = document.getElementById('hud-speed');
    const overlay = document.getElementById('screen-overlay');
    const btnPlay = document.getElementById('btn-play');

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060914);
      scene.fog = new THREE.FogExp2(0x060914, 0.012);

      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 400);
      camera.position.set(0, 3.5, 7);
      camera.lookAt(0, 1.8, -15);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Lights
      const ambLight = new THREE.AmbientLight(0x223355, 1.2);
      scene.add(ambLight);

      const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.5);
      dirLight.position.set(0, 20, 10);
      scene.add(dirLight);

      createEnvironment();
      createPlayer();
      setupEvents();

      animate(0);
    }

    // Grid Floor & Cyber Sky
    function createEnvironment() {
      // Endless Road
      const roadGeo = new THREE.PlaneGeometry(10, 400);
      const roadMat = new THREE.MeshBasicMaterial({ color: 0x090f22 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.z = -150;
      scene.add(road);

      // Neon Lane Markers
      [-1.4, 1.4, -4.2, 4.2].forEach(x => {
        const lineGeo = new THREE.BufferGeometry();
        const pts = [new THREE.Vector3(x, 0.02, 50), new THREE.Vector3(x, 0.02, -350)];
        lineGeo.setFromPoints(pts);
        const lineMat = new THREE.LineBasicMaterial({ color: Math.abs(x) > 3 ? 0xf43f5e : 0x0ea5e9 });
        const line = new THREE.Line(lineGeo, lineMat);
        scene.add(line);
      });

      // Distant Synthwave Sun
      const sunGeo = new THREE.CircleGeometry(35, 32);
      const sunMat = new THREE.MeshBasicMaterial({ color: 0xff007f });
      const sun = new THREE.Mesh(sunGeo, sunMat);
      sun.position.set(0, 15, -280);
      scene.add(sun);

      // Cyber City skyline blocks
      const cityGroup = new THREE.Group();
      for (let i = 0; i < 60; i++) {
        const side = i % 2 === 0 ? -1 : 1;
        const w = 6 + Math.random() * 8;
        const h = 20 + Math.random() * 60;
        const d = 8 + Math.random() * 12;
        const bGeo = new THREE.BoxGeometry(w, h, d);
        const bMat = new THREE.MeshLambertMaterial({
          color: new THREE.Color().setHSL(0.6 + Math.random() * 0.1, 0.7, 0.12)
        });
        const building = new THREE.Mesh(bGeo, bMat);
        building.position.set(side * (12 + Math.random() * 30), h / 2, -Math.random() * 320);
        cityGroup.add(building);
      }
      scene.add(cityGroup);
    }

    function createPlayer() {
      player = new THREE.Group();

      // Hoverboard body
      const boardGeo = new THREE.BoxGeometry(1.0, 0.15, 2.2);
      const boardMat = new THREE.MeshLambertMaterial({ color: 0x0284c7 });
      const board = new THREE.Mesh(boardGeo, boardMat);
      board.position.y = 0.3;
      player.add(board);

      // Glow strips
      const glowGeo = new THREE.BoxGeometry(1.08, 0.06, 2.1);
      const glowMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.position.y = 0.3;
      player.add(glow);

      // Character torso / cyber runner
      const torsoGeo = new THREE.CylinderGeometry(0.3, 0.25, 1.2, 8);
      const torsoMat = new THREE.MeshLambertMaterial({ color: 0x3b82f6 });
      const torso = new THREE.Mesh(torsoGeo, torsoMat);
      torso.position.y = 1.1;
      player.add(torso);

      // Visor
      const visorGeo = new THREE.BoxGeometry(0.35, 0.15, 0.3);
      const visorMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee });
      const visor = new THREE.Mesh(visorGeo, visorMat);
      visor.position.set(0, 1.6, -0.15);
      player.add(visor);

      player.position.set(0, 0, 0);
      scene.add(player);
    }

    function spawnObstacle(z) {
      const lane = Math.floor(Math.random() * 3);
      const x = lanes[lane];
      const type = Math.random(); // 0: low laser (slide), 1: barricade, 2: high wall (dodge)

      let obs;
      if (type < 0.45) {
        // High Barricade (jump or dodge)
        const geo = new THREE.BoxGeometry(2.4, 1.4, 0.6);
        const mat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
        obs = new THREE.Mesh(geo, mat);
        obs.position.set(x, 0.7, z);
        obs.userData = { type: 'barricade', lane, w: 2.4, h: 1.4 };
      } else {
        // Laser Arch (slide underneath!)
        const arch = new THREE.Group();
        const beamGeo = new THREE.CylinderGeometry(0.12, 0.12, 2.6, 8);
        const beamMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e });
        const beam = new THREE.Mesh(beamGeo, beamMat);
        beam.rotation.z = Math.PI / 2;
        beam.position.y = 1.35;
        arch.add(beam);
        arch.position.set(x, 0, z);
        arch.userData = { type: 'laser', lane, w: 2.4, h: 1.5, requiresSlide: true };
        obs = arch;
      }

      scene.add(obs);
      obstacles.push(obs);

      // Maybe spawn energy cell in adjacent lane
      if (Math.random() > 0.4) {
        const itemLane = (lane + 1) % 3;
        const cellGeo = new THREE.OctahedronGeometry(0.4, 0);
        const cellMat = new THREE.MeshBasicMaterial({ color: 0xfacc15, wireframe: false });
        const cell = new THREE.Mesh(cellGeo, cellMat);
        cell.position.set(lanes[itemLane], 1.0, z);
        cell.userData = { lane: itemLane };
        scene.add(cell);
        items.push(cell);
      }
    }

    function handleInput(action) {
      if (!isRunning) return;
      if (action === 'left' && currentLane > 0) {
        currentLane--;
        targetX = lanes[currentLane];
        window.ArcadeSound.playTone(400, 300, 'sine', 0.08);
      } else if (action === 'right' && currentLane < 2) {
        currentLane++;
        targetX = lanes[currentLane];
        window.ArcadeSound.playTone(400, 500, 'sine', 0.08);
      } else if (action === 'jump' && !isJumping && !isSliding) {
        isJumping = true;
        jumpV = 0.32;
        window.ArcadeSound.playTone(300, 800, 'triangle', 0.15, 0.2);
      } else if (action === 'slide' && !isSliding) {
        isSliding = true;
        slideTimer = 35;
        if (isJumping) { jumpV = -0.3; } // quick dive
        window.ArcadeSound.playTone(600, 200, 'sine', 0.12, 0.15);
      }
    }

    function setupEvents() {
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleInput('left');
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleInput('right');
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') handleInput('jump');
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') handleInput('slide');
      });

      // Touch Buttons
      document.getElementById('btn-left').onclick = () => handleInput('left');
      document.getElementById('btn-right').onclick = () => handleInput('right');
      document.getElementById('btn-jump').onclick = () => handleInput('jump');
      document.getElementById('btn-slide').onclick = () => handleInput('slide');

      // Swipe Detection
      let touchStartX = 0, touchStartY = 0;
      window.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 30) handleInput('right');
          else if (dx < -30) handleInput('left');
        } else {
          if (dy < -30) handleInput('jump');
          else if (dy > 30) handleInput('slide');
        }
      }, { passive: true });

      btnPlay.onclick = () => startGame();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function startGame() {
      // Clear old
      obstacles.forEach(o => scene.remove(o));
      items.forEach(it => scene.remove(it));
      obstacles = [];
      items = [];

      currentLane = 1;
      targetX = 0;
      player.position.set(0, 0, 0);
      distance = 0;
      score = 0;
      speed = baseSpeed;
      isJumping = false;
      isSliding = false;
      jumpY = 0;
      jumpV = 0;

      // Spawn initial stream of obstacles
      for (let z = -40; z > -250; z -= 35) {
        spawnObstacle(z);
      }

      overlay.style.display = 'none';
      isRunning = true;
      window.ArcadeSound.playWin();
    }

    function gameOver() {
      isRunning = false;
      window.ArcadeSound.playHit();
      window.KidStorage.saveScore('neon-runner', Math.floor(distance + score * 10));

      overlay.style.display = 'flex';
      overlay.querySelector('.game-logo').textContent = 'CRASHED!';
      overlay.querySelector('.game-sub').textContent = `SURVIVED: ${Math.floor(distance)}m · CELLS: ${score} · TOTAL: ${Math.floor(distance + score * 10)}`;
      btnPlay.textContent = 'RUN AGAIN';
    }

    let lastTime = performance.now();
    function animate(time) {
      requestAnimationFrame(animate);
      const dt = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;

      if (isRunning) {
        distance += speed * dt;
        speed = Math.min(85, baseSpeed + distance * 0.015);

        hudDist.textContent = `${Math.floor(distance)}m`;
        hudScore.textContent = `${score}`;
        hudSpeed.textContent = `${(speed / baseSpeed).toFixed(1)}x`;

        // Procedural synth bass rhythm
        synthLoopTimer += dt;
        if (synthLoopTimer > 0.22) {
          synthLoopTimer = 0;
          if (window.ArcadeSound.enabled) {
            window.ArcadeSound.playTone(85, 40, 'sawtooth', 0.06, 0.04);
          }
        }

        // Smooth Lane switch
        player.position.x += (targetX - player.position.x) * 14 * dt;
        player.rotation.z = (player.position.x - targetX) * 0.15; // bank turn

        // Jump physics
        if (isJumping) {
          jumpY += jumpV;
          jumpV -= 1.0 * dt;
          if (jumpY <= 0) {
            jumpY = 0;
            isJumping = false;
          }
          player.position.y = jumpY;
        }

        // Slide mechanics
        if (isSliding) {
          slideTimer--;
          player.scale.set(1.2, 0.45, 1.2);
          if (slideTimer <= 0) {
            isSliding = false;
            player.scale.set(1, 1, 1);
          }
        }

        // Move obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.position.z += speed * dt;

          // Collision check
          if (Math.abs(obs.position.z - player.position.z) < 1.2) {
            if (Math.abs(obs.position.x - player.position.x) < 1.1) {
              if (obs.userData.requiresSlide && isSliding) {
                // Safely slid under laser!
              } else if (!obs.userData.requiresSlide && isJumping && jumpY > 1.2) {
                // Safely jumped over low barrier!
              } else {
                gameOver();
                return;
              }
            }
          }

          if (obs.position.z > 20) {
            scene.remove(obs);
            obstacles.splice(i, 1);
            spawnObstacle(-240);
          }
        }

        // Move items & rotation
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          it.position.z += speed * dt;
          it.rotation.y += 3.5 * dt;

          if (Math.abs(it.position.z - player.position.z) < 1.2 && Math.abs(it.position.x - player.position.x) < 1.4) {
            score++;
            window.ArcadeSound.playCoin();
            scene.remove(it);
            items.splice(i, 1);
          } else if (it.position.z > 20) {
            scene.remove(it);
            items.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
