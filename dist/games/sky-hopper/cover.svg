<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2404"/>
      <stop offset="50%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="overlay" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#060913" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#060913" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="540" x2="1280" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
  </g>

  <!-- Giant Icon Backdrop -->
  <text x="960" y="468" font-size="280" text-anchor="middle" opacity="0.35" filter="drop-shadow(0 0 40px #eab308)">🐝</text>

  <!-- Vignette overlay -->
  <rect width="1280" height="720" fill="url(#overlay)"/>

  <!-- Content -->
  <g transform="translate(64, 540)">
    <!-- Category Badge -->
    <rect width="130" height="34" rx="8" fill="rgba(255,255,255,0.12)" stroke="#eab308" stroke-width="1.5"/>
    <text x="65" y="22" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#eab308" text-anchor="middle" letter-spacing="1.5">TOUCH · CASUAL</text>

    <!-- Main Title -->
    <text x="0" y="90" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="2" filter="drop-shadow(0 4px 16px rgba(0,0,0,0.8))">HAPPY BEE</text>

    <!-- Subtitle -->
    <text x="0" y="130" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="2.5">GENTLE SKY FLIGHT</text>
  </g>
</svg>