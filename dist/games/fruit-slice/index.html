<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>水果切切切 - Fruit Slice</title>
  <link rel="stylesheet" href="../../shared/game-shell.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #1c130d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    }

    /* Top HUD */
    #hud {
      position: absolute; top: 60px; left: 24px; right: 24px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10;
    }
    .hud-stat {
      background: rgba(28, 19, 13, 0.85); backdrop-filter: blur(10px);
      border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 999px;
      padding: 8px 20px; color: #FFF; font-size: 18px; font-weight: 800;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 8px;
    }
    .lives-box { font-size: 20px; letter-spacing: 4px; }

    /* Overlay */
    #overlay {
      position: absolute; inset: 0; background: rgba(28, 19, 13, 0.88);
      backdrop-filter: blur(14px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 20; color: #FFF;
      padding: 24px; text-align: center;
    }
    .game-logo {
      font-size: clamp(36px, 8vw, 68px); font-weight: 900;
      background: linear-gradient(135deg, #F59E0B, #EF4444, #10B981);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px; letter-spacing: 2px;
    }
    .game-sub { font-size: 15px; color: #FCD34D; margin-bottom: 32px; font-weight: 600; }
    .btn-start {
      padding: 16px 52px; border-radius: 999px;
      background: linear-gradient(135deg, #F59E0B, #D97706); border: none;
      color: #FFF; font-size: 18px; font-weight: 800; cursor: pointer;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.5);
      transition: transform 0.15s ease;
    }
    .btn-start:active { transform: scale(0.94); }
    .hint-bar { margin-top: 24px; font-size: 13px; color: #92400E; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div class="hud-stat">
      <span>🍉 得分:</span><span id="score-text" style="color:#FCD34D;">0</span>
    </div>
    <div class="hud-stat">
      <span class="lives-box" id="lives-text">❤️❤️❤️</span>
    </div>
  </div>

  <div id="overlay">
    <h1 class="game-logo" id="overlay-title">水果切切切</h1>
    <p class="game-sub" id="overlay-sub">滑动手指切开所有水果，千万别切到炸弹！</p>
    <button class="btn-start" id="btn-start">开始切水果 (START)</button>
    <p class="hint-bar">👆 iPad 专属爽快体验 · 支持多指同时滑动切割！</p>
  </div>

  <script src="../../shared/game-shell.js"></script>
  <script>
    'use strict';
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');

    const FRUIT_TYPES = [
      { name: 'watermelon', emoji: '🍉', color: '#10B981', r: 38, pts: 1 },
      { name: 'orange', emoji: '🍊', color: '#F97316', r: 32, pts: 1 },
      { name: 'apple', emoji: '🍎', color: '#EF4444', r: 32, pts: 1 },
      { name: 'banana', emoji: '🍌', color: '#FACC15', r: 30, pts: 2 },
      { name: 'kiwi', emoji: '🥝', color: '#84CC16', r: 28, pts: 2 },
      { name: 'bomb', emoji: '💣', color: '#1E293B', r: 32, isBomb: true }
    ];

    let W, H;
    let fruits = [];
    let slices = [];
    let particles = [];
    let comboTexts = [];
    let activePointers = new Map(); // pointerId -> array of points {x, y, time}
    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let spawnTimer = 0;
    let currentCombo = 0;
    let comboResetTimer = 0;

    const scoreText = document.getElementById('score-text');
    const livesText = document.getElementById('lives-text');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const btnStart = document.getElementById('btn-start');

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function spawnFruitWave() {
      const count = 1 + Math.floor(Math.random() * 3);
      for (let i = 0; i < count; i++) {
        const isBomb = Math.random() < 0.22 && score > 5;
        const type = isBomb ? FRUIT_TYPES[FRUIT_TYPES.length - 1] : FRUIT_TYPES[Math.floor(Math.random() * (FRUIT_TYPES.length - 1))];

        const x = W * 0.15 + Math.random() * (W * 0.7);
        const y = H + 40;
        const vx = (W * 0.5 - x) * 0.008 + (Math.random() - 0.5) * 4;
        const vy = -(Math.random() * 4 + 14);

        fruits.push({
          type,
          x, y, vx, vy,
          rot: Math.random() * Math.PI,
          rotSpeed: (Math.random() - 0.5) * 0.1,
          sliced: false
        });
      }
    }

    function sliceFruit(f, strokeLine) {
      if (f.sliced) return;
      f.sliced = true;

      if (f.type.isBomb) {
        // Bomb hit!
        window.ArcadeSound.playHit();
        lives--;
        updateLives();
        spawnBombExplosion(f.x, f.y);
        if (lives <= 0) gameOver();
        return;
      }

      // Fruit sliced!
      score += f.type.pts;
      scoreText.textContent = score;
      currentCombo++;
      comboResetTimer = 25;

      window.ArcadeSound.playTone(400 + currentCombo * 80, 800, 'sine', 0.1, 0.2);

      // Spawn two fruit halves flying apart
      const angle = strokeLine ? Math.atan2(strokeLine.y2 - strokeLine.y1, strokeLine.x2 - strokeLine.x1) : 0;
      const normalAngle = angle + Math.PI / 2;

      slices.push({
        emoji: f.type.emoji,
        x: f.x, y: f.y,
        vx: f.vx + Math.cos(normalAngle) * 5,
        vy: f.vy + Math.sin(normalAngle) * 4,
        rot: f.rot,
        rotSpeed: 0.15,
        half: 'left'
      });
      slices.push({
        emoji: f.type.emoji,
        x: f.x, y: f.y,
        vx: f.vx - Math.cos(normalAngle) * 5,
        vy: f.vy - Math.sin(normalAngle) * 4,
        rot: f.rot,
        rotSpeed: -0.15,
        half: 'right'
      });

      // Juice splash particles
      for (let i = 0; i < 18; i++) {
        const pAngle = Math.random() * Math.PI * 2;
        const pSpeed = Math.random() * 8 + 3;
        particles.push({
          x: f.x, y: f.y,
          vx: Math.cos(pAngle) * pSpeed,
          vy: Math.sin(pAngle) * pSpeed,
          r: Math.random() * 5 + 3,
          color: f.type.color,
          alpha: 1.0
        });
      }

      if (currentCombo >= 3) {
        comboTexts.push({
          text: `COMBO x${currentCombo}!`,
          x: f.x, y: f.y - 30,
          alpha: 1.0
        });
      }
    }

    function spawnBombExplosion(x, y) {
      for (let i = 0; i < 40; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 12 + 4;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          r: Math.random() * 8 + 4,
          color: Math.random() < 0.5 ? '#EF4444' : '#F59E0B',
          alpha: 1.0
        });
      }
    }

    function checkSlicing(p1, p2) {
      fruits.forEach(f => {
        if (f.sliced) return;
        // Line-circle distance
        const d = distToSegment({ x: f.x, y: f.y }, p1, p2);
        if (d < f.type.r) {
          sliceFruit(f, { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y });
        }
      });
    }

    function distToSegment(p, v, w) {
      const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function updateLives() {
      livesText.textContent = '❤️'.repeat(Math.max(0, lives)) + '🤍'.repeat(Math.max(0, 3 - lives));
    }

    function gameOver() {
      isPlaying = false;
      window.ArcadeSound.playHit();
      window.KidStorage.saveScore('fruit-slice', score);

      overlay.style.display = 'flex';
      overlayTitle.textContent = '游戏结束';
      overlaySub.textContent = `切碎水果得分: ${score} 分！`;
      btnStart.textContent = '再玩一次 (PLAY AGAIN)';
    }

    function startGame() {
      fruits = [];
      slices = [];
      particles = [];
      comboTexts = [];
      score = 0;
      lives = 3;
      currentCombo = 0;
      scoreText.textContent = '0';
      updateLives();

      overlay.style.display = 'none';
      isPlaying = true;
      window.ArcadeSound.playWin();
    }

    // Touch & Pointer event handling (Multi-touch support)
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      activePointers.set(e.pointerId, [{ x: e.clientX, y: e.clientY, time: performance.now() }]);
    });

    canvas.addEventListener('pointermove', (e) => {
      e.preventDefault();
      if (!activePointers.has(e.pointerId)) return;
      const pts = activePointers.get(e.pointerId);
      const prev = pts[pts.length - 1];
      const cur = { x: e.clientX, y: e.clientY, time: performance.now() };
      pts.push(cur);

      if (isPlaying) {
        checkSlicing(prev, cur);
      }
    });

    function clearPointer(e) {
      activePointers.delete(e.pointerId);
    }
    canvas.addEventListener('pointerup', clearPointer);
    canvas.addEventListener('pointercancel', clearPointer);

    btnStart.onclick = () => startGame();

    // Game Loop
    function loop() {
      requestAnimationFrame(loop);

      // Clear Canvas
      ctx.fillStyle = '#1c130d';
      ctx.fillRect(0, 0, W, H);

      // Wood Plank Background Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 2;
      for (let y = 80; y < H; y += 80) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      if (isPlaying) {
        // Combo Timer
        if (comboResetTimer > 0) {
          comboResetTimer--;
          if (comboResetTimer <= 0) currentCombo = 0;
        }

        // Spawn fruits
        spawnTimer++;
        if (spawnTimer > 70) {
          spawnTimer = 0;
          spawnFruitWave();
        }

        // Update Fruits
        for (let i = fruits.length - 1; i >= 0; i--) {
          const f = fruits[i];
          f.x += f.vx;
          f.y += f.vy;
          f.vy += 0.35; // Gravity
          f.rot += f.rotSpeed;

          // Missed unsliced fruit
          if (f.y > H + 60) {
            if (!f.sliced && !f.type.isBomb) {
              lives--;
              updateLives();
              window.ArcadeSound.playHit();
              if (lives <= 0) {
                gameOver();
                return;
              }
            }
            fruits.splice(i, 1);
            continue;
          }

          if (!f.sliced) {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.rot);
            ctx.font = `${f.type.r * 1.8}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(f.type.emoji, 0, 0);
            ctx.restore();
          }
        }

        // Update Sliced Halves
        for (let i = slices.length - 1; i >= 0; i--) {
          const s = slices[i];
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.45;
          s.rot += s.rotSpeed;

          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate(s.rot);
          ctx.font = '36px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(s.emoji, 0, 0);
          ctx.restore();

          if (s.y > H + 80) slices.splice(i, 1);
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.2;
          p.alpha -= 0.02;
          if (p.alpha <= 0) {
            particles.splice(i, 1);
            continue;
          }
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }

        // Combo Texts
        for (let i = comboTexts.length - 1; i >= 0; i--) {
          const ct = comboTexts[i];
          ct.y -= 1.2;
          ct.alpha -= 0.02;
          if (ct.alpha <= 0) {
            comboTexts.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.font = 'bold 24px sans-serif';
          ctx.fillStyle = '#FACC15';
          ctx.globalAlpha = ct.alpha;
          ctx.textAlign = 'center';
          ctx.shadowColor = '#000';
          ctx.shadowBlur = 8;
          ctx.fillText(ct.text, ct.x, ct.y);
          ctx.restore();
        }
      }

      // Draw Glowing Blade Trails for all active pointers
      const now = performance.now();
      activePointers.forEach(pts => {
        // Purge old points
        while (pts.length > 0 && now - pts[0].time > 140) {
          pts.shift();
        }
        if (pts.length < 2) return;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i].x, pts[i].y);
        }
        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = '#38BDF8';
        ctx.shadowBlur = 15;
        ctx.stroke();

        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      });
    }

    loop();
  </script>
</body>
</html>
